services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-app:latest
    container_name: weather-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - weather-network
    depends_on:
      - postgres
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=weather_db
      - DB_USERNAME=weather_user
      - DB_PASSWORD=weather_password

  nginx:
    image: nginx:alpine
    container_name: weather-nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - weather-network
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - weather-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weather-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@weather.ru
      PGADMIN_DEFAULT_PASSWORD: weather_admin
    ports:
      - "8084:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - weather-network
    depends_on:
      - postgres

networks:
  weather-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
