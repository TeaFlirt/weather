[PHP]
; Основные настройки
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

; Временная зона
date.timezone = Europe/Moscow

; Ошибки (для разработки)
display_errors = On
error_reporting = E_ALL

; Сессии
session.auto_start = Off
session.gc_maxlifetime = 1440